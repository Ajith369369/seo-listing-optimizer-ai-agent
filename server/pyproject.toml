[project]
name = "ec-seo-server"
version = "1.0.0"
description = "FastAPI backend for SEO Listing Optimizer AI Agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "google-generativeai>=0.8.3",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.10"
include = ["."]
